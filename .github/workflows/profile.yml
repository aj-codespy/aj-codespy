name: Redraw profile

# Redraws every README image daily and publishes them to the `output` branch.
on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "assets/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Draw sheets and stats
        run: node scripts/build.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#10204a&color_dots=#e9e5dc,#f3c4a3,#e8925f,#d9662c,#c2410c
            dist/snake-dark.svg?color_snake=#eef2fb&color_dots=#1b2a4a,#6b4a45,#b5603a,#e57540,#ff8a4c

      - name: Draw 3D contribution city
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: assets/3d-settings.json

      - run: cp profile-3d-contrib/city-*.svg dist/

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: "Redraw profile images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
